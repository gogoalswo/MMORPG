# godot/ 를 안드로이드 APK 로 구워 Actions 산출물로 올린다.
#
# 폰에서 받는 법: Actions 탭 → 이 워크플로우의 최근 실행 → 아래 Artifacts 의
# mmorpg-apk 를 받아 압축을 풀고 설치한다 (출처를 알 수 없는 앱 설치 허용 필요).
#
# 왜 CI 에서 굽나: 익스포트 템플릿 1GB 와 안드로이드 SDK 가 필요한데,
# 개발 세션 컨테이너는 매번 사라진다. 여기선 캐시가 되므로 첫 빌드만 느리다.
# 자세한 건 docs/features/godot-migration.md.

name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'godot/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: 고도와 익스포트 템플릿 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: 고도와 익스포트 템플릿 받기
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          base="https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable"
          curl -fsSL -o /tmp/godot.zip "$base&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base&slug=export_templates.tpz&platform=templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: 디버그 서명 키 만들기
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: 에디터 설정 (안드로이드 SDK 위치와 디버그 키)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES

      - name: 에셋 임포트
        run: ~/godot-bin/godot --headless --path godot --import

      - name: APK 빌드
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          ~/godot-bin/godot --headless --path godot \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/mmorpg.apk"
          ls -lh "$GITHUB_WORKSPACE/build"

      - uses: actions/upload-artifact@v4
        with:
          name: mmorpg-apk
          path: build/mmorpg.apk
          if-no-files-found: error
