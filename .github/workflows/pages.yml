# main 에 올리면 고도 클라이언트를 웹으로 구워 GitHub Pages 에 올린다.
#
# 스레드를 끈 빌드여야 한다 — 켜면 SharedArrayBuffer 가 필요하고 그러려면
# COOP/COEP 헤더를 서버가 보내야 하는데 Pages 는 헤더를 못 넣는다.
# 자세한 건 godot/export_presets.cfg 와 docs/features/godot-migration.md.
#
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 둔다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 고도와 익스포트 템플릿 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: 고도와 익스포트 템플릿 받기
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          base="https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable"
          curl -fsSL -o /tmp/godot.zip "$base&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base&slug=export_templates.tpz&platform=templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # 판정이 TS 와 갈라지면 여기서 멈춘다. 배포까지 가지 않는다
      # 화면에 찍어 "지금 보는 것이 어느 빌드인가" 를 바로 알 수 있게 한다.
      # 브라우저가 최대 10분 캐시하므로 이게 없으면 구분할 방법이 없다
      - name: 빌드 표시 굽기
        run: |
          printf '{"commit":"%s","at":"%s"}\n' \
            "$(git rev-parse --short HEAD)" "$(date -u '+%m-%d %H:%M')" > godot/build.json
          cat godot/build.json

      - name: 고도 테스트
        run: |
          set -e
          npm run sync:godot
          ~/godot-bin/godot --headless --path godot --import
          # 테스트를 더해도 여기는 안 고친다. 실패한 것만 자세히 찍는다
          GODOT=~/godot-bin/godot npm run test:godot

      - name: 고도 웹 빌드
        run: |
          set -e
          mkdir -p site
          ~/godot-bin/godot --headless --path godot --import
          ~/godot-bin/godot --headless --path godot \
            --export-release "Web" "$GITHUB_WORKSPACE/site/index.html"
          # pck 안이 아니라 사이트에 나란히 둔다. 게임이 ?t= 를 붙여 받아
          # 캐시한 이전 빌드를 보고 있는지 스스로 확인한다 (Build.check_latest)
          node -e "
            const b = require('./godot/build.json');
            require('fs').writeFileSync('site/build.txt', b.commit + ' ' + b.at + '\n');
          "
          ls -lh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
